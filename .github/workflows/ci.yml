name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install black ruff
      - run: black --check services/inference/ shared/python/
      - run: ruff check services/inference/ shared/python/

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --release

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-cov
      - run: pytest services/inference/ --cov=src

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-rust, lint-python, test-rust, test-python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/doc-ai/gateway:latest services/gateway
          docker build -t ghcr.io/doc-ai/auth:latest services/auth
          docker build -t ghcr.io/doc-ai/inference:latest services/inference
          docker push ghcr.io/doc-ai/gateway:latest
          docker push ghcr.io/doc-ai/auth:latest
          docker push ghcr.io/doc-ai/inference:latest
