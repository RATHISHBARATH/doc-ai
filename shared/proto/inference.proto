syntax = "proto3";

package doc_ai.inference;

service Inference {
  // Unary inference – sends a prompt and returns the full generated text.
  rpc Infer (InferRequest) returns (InferResponse);

  // Streaming inference – sends tokens one by one as they are generated.
  rpc StreamInfer (InferRequest) returns (stream InferResponse);
}

message InferRequest {
  // The input prompt for the model.
  string prompt = 1;

  // Maximum number of tokens to generate.
  int32 max_tokens = 2;

  // Temperature for sampling (0.0 = deterministic, higher = more random).
  float temperature = 3;

  // Optional model name (for future multi‑model support). If empty, the default model is used.
  string model_name = 4;
}

message InferResponse {
  // The generated text (full for unary, incremental token for streaming).
  string text = 1;

  // Confidence score (optional; may be omitted for streaming).
  float confidence = 2;

  // Latency in milliseconds (optional).
  int64 latency_ms = 3;
}