syntax = "proto3";

package doc_ai.auth;

service Auth {
  rpc Authenticate (LoginRequest) returns (LoginResponse);
  rpc ValidateToken (ValidateRequest) returns (ValidateResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string user_id = 2;
}

message ValidateRequest {
  string token = 1;
}

message ValidateResponse {
  bool valid = 1;
  string user_id = 2;
}
