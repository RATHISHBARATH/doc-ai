[package]
name = "doc-ai-common"
version = "0.1.0"
edition = "2021"
description = "Shared utilities and Protobuf types for the DOC AI ecosystem"
authors = ["Your Name <email@example.com>"]

[dependencies]
tonic = "0.11"
prost = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
thiserror = "1"
sys-info = "0.9"   # For hardware detection (future)

[build-dependencies]
tonic-build = "0.11"