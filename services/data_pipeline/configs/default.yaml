# ============================================================
# DOC AI Data Pipeline – Default Configuration
# ============================================================
# This configuration is designed for a full production run.
# Override settings (e.g., MinIO, PostgreSQL, data sources) via
# environment variables or by using a separate environment‑specific
# configuration file (e.g., development.yaml, production.yaml).
# ============================================================

# Data sources – large, diverse, permissively licensed datasets.
# For initial testing, reduce max_documents to a smaller number.
data_sources:
  - name: "the_pile_subset"
    url: "https://huggingface.co/datasets/EleutherAI/the_pile/resolve/main/train/00.jsonl.zst"
    format: "jsonl"
    compression: "zst"
    max_documents: 100000

  - name: "c4_subset"
    url: "https://huggingface.co/datasets/allenai/c4/resolve/main/en/c4-train.00000-of-01024.json.gz"
    format: "jsonl"
    compression: "gzip"
    max_documents: 50000

  - name: "wikipedia_en"
    url: "https://huggingface.co/datasets/wikipedia/resolve/main/20220301.en.parquet"
    format: "parquet"
    compression: null
    max_documents: 50000

# Cleaning configuration
cleaning:
  fix_unicode: true
  normalize_whitespace: true
  remove_control_chars: true
  filter_language: "en"
  scrub_pii: true

# Deduplication configuration
deduplication:
  threshold: 0.8 # Jaccard similarity threshold for near‑duplicates
  num_permutations: 128 # Number of MinHash permutations
  batch_size: 10000 # Documents per batch

# Quality filtering configuration
quality_filter:
  min_words: 50
  max_words: 10000
  max_punctuation_ratio: 0.3
  min_stop_word_ratio: 0.05
  scorer_model_path: null # Optional: path to a perplexity model

# Tokenizer training configuration
tokenizer:
  vocab_size: 100000
  special_tokens:
    - "[PAD]"
    - "[UNK]"
    - "[BOS]"
    - "[EOS]"
    - "[SEP]"
    - "[MASK]"
  min_frequency: 2
  sample_size: 5000000000 # 5 GB (adjust based on available storage)

# Dataset preparation configuration
dataset_prep:
  max_length: 512 # Sequence length for training
  stride: 256 # Overlap for chunking
  output_format: "parquet"

# MinIO configuration (defaults for local development)
# In production, override these via environment variables (e.g., DOC_MINIO_ENDPOINT).
minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "changeme"
  bucket: "doc-ai-data"
  secure: false

# PostgreSQL configuration (defaults for local development)
# In production, override these via environment variables.
postgres:
  host: "localhost"
  port: 5432
  database: "doc_ai_metadata"
  user: "doc_user"
  password: "changeme"

# Workflow orchestration configuration
workflow:
  max_retries: 3
  retry_delay_seconds: 5
  checkpoint_interval: 1000

# Data directory paths (relative to the pipeline root)
data_root: "./data"
cleaned_dir: "./data/cleaned"
deduped_dir: "./data/deduped"
filtered_dir: "./data/filtered"
tokenized_dir: "./data/tokenized"
final_dir: "./data/final"
