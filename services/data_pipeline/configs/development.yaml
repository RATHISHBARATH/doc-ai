# ============================================================
# DOC AI Data Pipeline – Development Configuration Overrides
# ============================================================

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "changeme"
  bucket: "doc-ai-data"
  secure: false

postgres:
  host: "postgres"
  port: 5432
  database: "doc_ai_metadata"
  user: "doc_user"
  password: "changeme"

data_sources:
  - name: "test_data"
    url: "http://172.19.44.67:8001/test.jsonl"
    format: "jsonl"
    compression: null
    max_documents: 20

cleaning:
  fix_unicode: true
  normalize_whitespace: true
  remove_control_chars: true
  filter_language: "en"
  scrub_pii: true

deduplication:
  threshold: 0.8
  num_permutations: 16
  batch_size: 1000

quality_filter:
  min_words: 2
  max_words: 1000
  max_punctuation_ratio: 0.5
  min_stop_word_ratio: 0.0
  scorer_model_path: null

tokenizer:
  vocab_size: 1000
  special_tokens:
    - "[PAD]"
    - "[UNK]"
    - "[BOS]"
    - "[EOS]"
    - "[SEP]"
    - "[MASK]"
  min_frequency: 1
  sample_size: 1048576

dataset_prep:
  max_length: 64
  stride: 32
  output_format: "parquet"

workflow:
  max_retries: 1
  retry_delay_seconds: 2
  checkpoint_interval: 100

data_root: "/tmp/data_dev"
cleaned_dir: "/tmp/data_dev/cleaned"
deduped_dir: "/tmp/data_dev/deduped"
filtered_dir: "/tmp/data_dev/filtered"
tokenized_dir: "/tmp/data_dev/tokenized"
final_dir: "/tmp/data_dev/final"
