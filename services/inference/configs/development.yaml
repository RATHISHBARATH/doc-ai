# ============================================================
# DOC AI Inference Service – Configuration (Full)
# ============================================================

# MinIO configuration (used by inference to load adapter)
minio:
  endpoint: minio:9000
  access_key: minioadmin
  secret_key: changeme
  bucket: doc-ai-data
  secure: false

# PostgreSQL configuration (not used by inference, but required by the shared config loader)
postgres:
  host: postgres
  database: doc_ai
  user: doc_user
  password: changeme
  port: 5432

# Data sources (dummy, not used)
data_sources:
  - name: dummy
    url: dummy
    format: dummy

# Cleaning (dummy)
cleaning:
  fix_unicode: false
  normalize_whitespace: false
  remove_control_chars: false
  scrub_pii: false

# Deduplication (dummy)
deduplication:
  threshold: 0.8
  num_permutations: 128
  batch_size: 10000

# Quality filter (dummy)
quality_filter:
  min_words: 1
  max_words: 1000
  max_punctuation_ratio: 0.5
  min_stop_word_ratio: 0.0

# Tokenizer (dummy)
tokenizer:
  vocab_size: 1000
  special_tokens: []
  min_frequency: 1
  sample_size: 100

# Dataset prep (dummy)
dataset_prep:
  max_length: 512
  stride: 256
  output_format: parquet

# Workflow (dummy)
workflow:
  max_retries: 1
  retry_delay_seconds: 1
  checkpoint_interval: 1000
