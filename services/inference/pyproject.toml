[tool.poetry]
name = "inference"
version = "0.1.0"
description = "DOC AI Inference Service – Phase 2 (Model Serving)"
authors = ["Your Name <email@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110"
uvicorn = { version = "^0.29", extras = ["standard"] }
grpcio = "^1.62"
grpcio-tools = "^1.62"
transformers = "^4.39"
torch = "^2.3"
accelerate = "^0.27"
bitsandbytes = "^0.43"
prometheus-client = "^0.20"
python-json-logger = "^2.0"
opentelemetry-api = "^1.23"
opentelemetry-sdk = "^1.23"
opentelemetry-exporter-otlp = "^1.23"
opentelemetry-instrumentation-grpc = "^0.45b0"
opentelemetry-instrumentation-fastapi = "^0.45b0"   # <-- Added

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"