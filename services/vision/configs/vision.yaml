# ============================================================
# DOC AI Vision Service – Configuration
# ============================================================

# Service ports
vision:
  grpc_port: 50055
  http_port: 8002

# Model paths and settings
models:
  object_detection: yolov8n.pt # YOLOv8 nano model (fast, lightweight)
  face_recognition: default # Uses dlib's default face recognition model
  ocr: tesseract # OCR engine (Tesseract)
  pose: mediapipe # Pose estimation engine (MediaPipe)

# Video processing configuration
video:
  frame_interval: 1 # Extract 1 frame per second
  scene_threshold: 30.0 # Scene detection sensitivity (higher = fewer scenes)
  max_video_size_mb: 5000 # Maximum video file size to process (5 GB)
  output_format: mp4 # Output format for processed clips

# Vector database (Milvus) configuration
milvus:
  host: milvus
  port: 19530
  collection: video_scenes
  embedding_dim: 512 # Dimension of scene embeddings
  index_type: IVF_FLAT # Index type for fast similarity search
  metric_type: L2 # Distance metric (L2, IP, COSINE)
  nlist: 128 # Number of clusters for IVF index

# Storage (MinIO) configuration
storage:
  minio_bucket: doc-ai-vision
  raw_images_prefix: raw/images/
  raw_videos_prefix: raw/videos/
  processed_images_prefix: processed/images/
  processed_videos_prefix: processed/videos/
  frames_prefix: frames/
  scenes_prefix: scenes/
  metadata_prefix: metadata/

# Crawler configuration
crawler:
  enabled: true # Enable the automated crawler
  schedule: "0 0 * * *" # Daily at midnight (cron format)
  max_items_per_run: 1000 # Maximum items to fetch per run
  sources:
    - name: movie_metadata
      url: https://api.themoviedb.org/3
      type: rest
    - name: open_images
      url: https://storage.googleapis.com/openimages/
      type: s3

# Dataset ingestion configuration
ingestion:
  deduplication_enabled: true
  validation_enabled: true
  max_download_workers: 4
  chunk_size_mb: 100

# Logging
logging:
  level: INFO
  format: json
  output: console
