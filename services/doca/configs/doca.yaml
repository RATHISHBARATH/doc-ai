# ============================================================
# DOCA Central Intelligence – Global Configuration
# ============================================================

coordinator:
  port: 50054 # gRPC port for DOCA API
  http_port: 8001 # HTTP port for health/metrics
  max_concurrent_workflows: 100

workflow_engine:
  max_parallel_tasks: 10
  default_timeout_seconds: 60
  max_retries: 3
  initial_delay_ms: 1000
  backoff_factor: 2.0

agent_factory:
  agent_image: doca-agent:latest
  agent_memory_limit_mb: 512
  agent_timeout_seconds: 60

reasoning_core:
  default_model: distilgpt2
  adapter_version: distilgpt2_lora_8_3epochs
  max_tokens: 150
  temperature: 0.7

consensus_engine:
  num_agents: 3
  voting_method: weighted # "weighted" | "bayesian"
  confidence_threshold: 0.7

memory:
  short_term_ttl_seconds: 3600
  long_term_enabled: true
  vector_retrieval_top_k: 5

inference:
  grpc_addr: inference:50053
  timeout_seconds: 10

# NATS connection URL (can also be set via env DOCA_NATS_URL)
nats_url: nats://nats:4222

# Redis URL (can also be set via env DOCA_REDIS_URL)
redis_url: redis://redis:6379

# Logging
log_level: INFO
