services:
  # ===================== BACKING SERVICES =====================

  postgres:
    image: pgvector/pgvector:pg15          # ← CHANGED: includes vector extension
    container_name: doc-postgres
    environment:
      POSTGRES_USER: doc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: doc_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: doc-redis
    ports:
      - "6379:6379"
    networks:
      - doc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nats:
    image: nats:latest
    container_name: doc-nats
    command:
      - "-js"            # Enable JetStream for durable queues
      - "-m"             # Enable monitoring on port 8222
      - "8222"
    ports:
      - "4222:4222"      # client port
      - "8222:8222"      # monitoring
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  minio:
    image: minio/minio:latest
    container_name: doc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Web UI
    volumes:
      - minio_data:/data
    networks:
      - doc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: doc-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - doc-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: doc-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - doc-network
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  loki:
    image: grafana/loki:latest
    container_name: doc-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    networks:
      - doc-network
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: doc-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ===================== CORE SERVICES =====================

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    container_name: doc-gateway
    environment:
      - GATEWAY_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - POSTGRES_URL=postgres://doc_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/doc_ai
      - DATABASE_URL=postgres://doc_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/doc_ai
      - REDIS_URL=redis://redis:6379
      - AUTH_ADDR=http://auth:50051
      - AUTH_HTTP_ADDR=http://auth:50052
      - INFERENCE_ADDR=http://inference:50053
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      inference:
        condition: service_healthy
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    volumes:
      - ./certs:/certs:ro

  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    container_name: doc-auth
    environment:
      - AUTH_GRPC_PORT=50051
      - AUTH_HTTP_PORT=50052
      - POSTGRES_URL=postgres://doc_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/doc_ai
      - DATABASE_URL=postgres://doc_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/doc_ai
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - OTEL_SERVICE_NAME=auth
      - OTEL_ENDPOINT=http://jaeger:4317
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    ports:
      - "50051:50051"
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./certs:/certs:ro

  inference:
    build:
      context: ../..
      dockerfile: services/inference/Dockerfile
    container_name: doc-inference
    environment:
      - INFERENCE_GRPC_PORT=50053
      - INFERENCE_HTTP_PORT=8000
      - MODEL_NAME=distilgpt2
      - USE_GPU=auto
      - MODEL_QUANTIZE=none
      - MAX_BATCH_SIZE=8
      - BATCH_TIMEOUT_MS=50
      - OTEL_SERVICE_NAME=inference
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    ports:
      - "8000:8000"
      - "50053:50053"
    depends_on:
      - nats
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5

  data_pipeline:
    build:
      context: ../../services/data_pipeline
      dockerfile: Dockerfile
    container_name: doc-data-pipeline
    environment:
      - DOC_CONFIG_PATH=configs/development.yaml
      - DOC_MINIO__ENDPOINT=minio:9000
      - DOC_MINIO__ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - DOC_MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme}
      - DOC_MINIO__BUCKET=doc-ai-data
      - DOC_MINIO__SECURE=false
      - DOC_POSTGRES__HOST=postgres
      - DOC_POSTGRES__PORT=5432
      - DOC_POSTGRES__DATABASE=doc_ai
      - DOC_POSTGRES__USER=doc_user
      - DOC_POSTGRES__PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DOC_WORKFLOW__MAX_RETRIES=3
      - DOC_WORKFLOW__RETRY_DELAY_SECONDS=5
    depends_on:
      - minio
      - postgres
    networks:
      - doc-network
    restart: no
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./data_pipeline_data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface

  trainer:
    build:
      context: ../../services/trainer
      dockerfile: Dockerfile
    container_name: doc-trainer
    environment:
      - DOC_CONFIG_PATH=configs/training.yaml
      - DOC_MINIO__ENDPOINT=minio:9000
      - DOC_MINIO__ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - DOC_MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme}
      - DOC_MINIO__BUCKET=doc-ai-data
      - DOC_MINIO__SECURE=false
      - DOC_POSTGRES__HOST=postgres
      - DOC_POSTGRES__PORT=5432
      - DOC_POSTGRES__DATABASE=doc_ai
      - DOC_POSTGRES__USER=doc_user
      - DOC_POSTGRES__PASSWORD=${POSTGRES_PASSWORD:-changeme}
    networks:
      - doc-network
    depends_on:
      - minio
      - postgres
    restart: no
    deploy:
      resources:
        limits:
          memory: 4G

  # ===================== DOCA CENTRAL INTELLIGENCE =====================

  doca:
    build:
      context: ../..
      dockerfile: services/doca/Dockerfile
    container_name: doc-doca
    environment:
      # DOCA configuration
      - DOCA_CONFIG_PATH=configs/doca.yaml
      - DOCA_NATS_URL=nats://nats:4222
      - DOCA_REDIS_URL=redis://redis:6379
      - DOCA_POSTGRES_URL=postgres://doc_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/doc_ai
      - DOCA_MINIO_ENDPOINT=minio:9000
      - DOCA_MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - DOCA_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme}
      - DOCA_MINIO_BUCKET=doc-ai-data
      - DOCA_INFERENCE_ADDR=inference:50053
      - DOCA_LOG_LEVEL=INFO
      - DOCA_OTEL_ENDPOINT=http://jaeger:4317
    ports:
      - "50054:50054"   # gRPC
      - "8001:8001"     # HTTP health/metrics
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      inference:
        condition: service_healthy
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ./doca_data:/app/data
      - ../../services/doca/configs:/app/configs

  # ===================== VISION SERVICE (PHASE 6) =====================

  vision:
    build:
      context: ../..
      dockerfile: services/vision/Dockerfile
    container_name: doc-vision
    environment:
      - VISION_CONFIG_PATH=/app/configs/vision.yaml
      - VISION_NATS_URL=nats://nats:4222
      - VISION_REDIS_URL=redis://redis:6379
      - VISION_MINIO_ENDPOINT=minio:9000
      - VISION_MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - VISION_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme}
      - VISION_MINIO_BUCKET=doc-ai-vision
      - VISION_MILVUS_HOST=milvus
      - VISION_MILVUS_PORT=19530
      - VISION_LOG_LEVEL=INFO
      - VISION_OTEL_ENDPOINT=http://jaeger:4317
    ports:
      - "50055:50055"   # gRPC
      - "8002:8002"     # HTTP health/metrics
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - vision_data:/app/data
      - ../../services/vision/configs:/app/configs:ro

  # ===================== VECTOR DB (MILVUS) =====================

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.0
    container_name: doc-etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    ports:
      - "2379:2379"
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  milvus:
    image: milvusdb/milvus:latest
    container_name: doc-milvus
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # REST
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - doc-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      - etcd
      - minio

networks:
  doc-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  milvus_data:
  vision_data:
  doca_data:
  trainer_data:
  data_pipeline_data: