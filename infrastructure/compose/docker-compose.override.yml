# ============================================================
# Docker Compose Override for Local Development
# ============================================================

# This file overrides/adds configurations to the main docker-compose.yml.
# It is not committed to version control (added to .gitignore).

services:
  # Add Loki logging driver to all services (optional)
  # The loki driver must be installed first: 
  # docker plugin install grafana/loki-docker-driver:latest --alias loki

  postgres:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-external-labels: "service=postgres"

  redis:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-external-labels: "service=redis"

  nats:
