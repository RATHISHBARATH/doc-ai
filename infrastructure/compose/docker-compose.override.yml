        loki-batch-size: "400"
        loki-external-labels: "service=grafana"

  loki:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-external-labels: "service=loki"

  jaeger:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-external-labels: "service=jaeger"

  gateway:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-external-labels: "service=gateway"

  auth:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-external-labels: "service=auth"

  inference:
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-external-labels: "service=inference"

  # ============================================================
  # Data Pipeline service overrides
  # ============================================================
  data_pipeline:
    # Run as root to avoid permission issues with internal directories.
    user: root
    # Allow the container to reach the host on Linux (host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"